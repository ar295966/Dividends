<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raw Grid — The State of AI at Work</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --pink: #f2d4cf;
  --green: #e5edd6;
  --gray: #f5f5f5;
  --border: 3px solid var(--black);
  --shadow: 6px 6px 0 var(--black);
}
html, body {
  width: 100%; height: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
  background: var(--white);
  color: var(--black);
  overflow: hidden;
}
.slide-deck { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
.slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; background: var(--white); overflow: hidden; }
.slide-content { width: 100%; height: 100%; overflow: hidden; }

.t-display { font-size: clamp(48px, 7vw, 96px); font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; text-transform: uppercase; }
.t-subtitle { font-size: clamp(16px, 1.4vw, 22px); font-weight: 700; line-height: 1.3; text-transform: uppercase; letter-spacing: 0.04em; }
.t-body { font-size: clamp(16px, 1.3vw, 20px); font-weight: 500; line-height: 1.6; }
.t-caption { font-size: clamp(11px, 1vw, 13px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }

.label { display: inline-block; background: var(--black); color: var(--white); padding: 6px 14px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }

/* SLIDE 1 COVER */
.s1 .slide-content { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
.s1-left { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(32px, 4vw, 64px); background: var(--pink); border-right: var(--border); }
.s1-brand { display: flex; align-items: center; gap: 12px; }
.s1-logo-box { width: 48px; height: 48px; border: var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; background: var(--white); }
.s1-brand-text { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
.s1-headline { margin-top: auto; margin-bottom: auto; }
.s1-meta { display: flex; flex-direction: column; gap: 6px; }
.s1-right { display: flex; flex-direction: column; }
.s1-list-item { flex: 1; display: flex; align-items: center; padding: 0 clamp(24px, 3vw, 48px); border-bottom: var(--border); font-size: clamp(18px, 2vw, 28px); font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
.s1-list-item:last-child { border-bottom: none; }
.s1-list-item::before { content: "\2192\00a0"; margin-right: 12px; font-size: 0.85em; }
.s1-list-item.highlight { background: var(--green); }
</style>
</head>
<body>
<div class="slide-deck" id="deck">
  <div class="slide s1 active">
    <div class="slide-content">
      <div class="s1-left">
        <div class="s1-brand">
          <div class="s1-logo-box">AI</div>
          <span class="s1-brand-text">RESEARCH</span>
        </div>
        <div class="s1-headline">
          <div class="t-display">The State<br>of AI<br>at Work.</div>
        </div>
        <div class="s1-meta">
          <span class="label">May 2026</span>
        </div>
      </div>
      <div class="s1-right">
        <div class="s1-list-item">The adoption curve</div>
        <div class="s1-list-item highlight">Who's actually using it</div>
        <div class="s1-list-item">Impact on team structure</div>
        <div class="s1-list-item">Productivity &amp; output</div>
        <div class="s1-list-item">Where resistance lives</div>
        <div class="s1-list-item">What comes next</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
